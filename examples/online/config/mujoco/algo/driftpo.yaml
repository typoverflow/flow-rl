# @package _global_

algo:
  name: driftpo
  backbone_cls: mlp

  actor_hidden_dims: [256, 256, 256]
  actor_activation: mish
  actor_lr: 0.0003
  noise_dim: 16

  critic_hidden_dims: [256, 256]
  critic_activation: relu
  critic_lr: 0.0003
  critic_ensemble_size: 5

  discount: 0.99
  ema: 0.005

  # drifting policy (tuned on HalfCheetah-v5: 8502@400k, 10715@1M)
  temp: ${oc.select:algo.temp_dict.${task},0.1}   # lambda for pi* propto exp(Q/temp); the per-env knob
  temp_dict:
    HalfCheetah-v5: 0.1
  base_step_size: 0.04       # effective drift step = base_step_size * h_t

  # annealed bandwidth h_init -> h_end
  bandwidth_init: 0.2
  bandwidth_end: 0.01
  bandwidth_anneal_steps: 1000000

  num_train_samples: 32     # drift MC samples (a^+ neighborhood == a^- policy)

  num_samples: 10           # best-of-N at eval time
  x_min: -1.0
  x_max: 1.0
