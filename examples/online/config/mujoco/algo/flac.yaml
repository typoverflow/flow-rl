# @package _global_

algo:
  name: flac
  critic_backbone_cls: mlp
  critic_hidden_dims: [256, 256]
  critic_activation: relu
  critic_layer_norm: false
  critic_initializer: default
  critic_ensemble_size: 2
  critic_lr: 0.0003
  distributional_critic: false
  critic_num_atoms: 101
  critic_v_min: -10.0
  critic_v_max: 150.0
  discount: 0.99
  ema: 0.005
  reward_scale: 0.2
  update_actor_every: 2
  target_kinetic_coef: 2.5
  init_log_alpha: 0.0
  alpha_lr: 0.00003
  clip_grad_norm: null
  flow:
    hidden_dims: [512, 512]
    activation: elu
    layer_norm: true
    initializer: xavier_uniform
    lr: 0.0003
    steps: 1
